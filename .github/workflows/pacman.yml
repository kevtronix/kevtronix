# Save at: .github/workflows/pacman.yml  (in the kevtronix/kevtronix repo)
# One-time setup: Settings → Actions → General → Workflow permissions
#                 → enable "Read and write permissions"
# First run: trigger manually from the Actions tab.

name: Generate Pac-Man Game

on:
  schedule:
    - cron: "0 */24 * * *"   # refresh daily
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}